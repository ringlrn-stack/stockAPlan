name: Tushare Auction Agent

on:
  schedule:
    - cron: '35 1 * * 1-5' # 建议 09:35 运行，等待 Tushare 数据同步
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TUSHARE_TOKEN: ${{ secrets.91dba4a6bb22fc1b9970ae8005d5746a5120a0a652cc7df80fea8469 }}  # <--- 关键：注入 Token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: pip install tushare pandas openpyxl # 安装 tushare 库
      - run: python auction_agent.py
      - uses: actions/upload-artifact@v4
        with:
          name: Auction-Report
          path: |
            daily_report.xlsx
            daily_report.csv
