name: A-Stock Auction Agent

on:
  schedule:
    - cron: '32 1 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: # 赋予 Action 写权限
      contents: write
    steps:
      - name: 检查代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 安装依赖
        run: pip install requests pandas openpyxl

      - name: 运行抓取脚本
        run: python init_db.py

      - name: 自动上传 Excel 报告
        uses: actions/upload-artifact@v4
        with:
          name: Auction-Report
          path: daily_report.xlsx

      - name: 将更新后的数据库保存回仓库
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add history_auction.csv
          git commit -m "Update history database [skip ci]" || echo "No changes to commit"
          git push
