name: Monthly Auction Scanner (No Email)

on:
  schedule:
    # 每天北京时间 17:00 运行 (UTC 09:00)
    # 收盘后复盘最近30天数据
    - cron: '0 9 * * *'
  workflow_dispatch: # 允许手动按钮触发

jobs:
  run_analysis:
    runs-on: ubuntu-latest
    
    env:
      TZ: Asia/Shanghai

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          pip install tushare pandas openpyxl

      # 4. 运行核心扫描脚本
      - name: Run Scanner
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python jj2.py

      # 5. 上传结果 (关键步骤)
      # 脚本运行完后，GitHub 会把生成的 Excel 打包供你下载
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always() # 即使脚本中间报错，只要生成了文件尝试上传
        with:
          name: Auction-Reports
          path: |
            *.xlsx
