name: A-Stock Agent Simple

on:
  schedule:
    - cron: '32 1 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: pip install requests pandas openpyxl
      - run: python auction_agent.py
        uses: actions/upload-artifact@v4
        with:
          name: Auction-Results # 下载包的名字
          path: |
            daily_report.xlsx
            daily_report.csv
